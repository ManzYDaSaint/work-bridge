name: Daily Database Backup

on:
    schedule:
        # Run at 02:00 UTC every day
        - cron: "0 2 * * *"
    # Allow manual trigger
    workflow_dispatch:

jobs:
    backup:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install PostgreSQL Client
              run: |
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client

            - name: Create Backup Directory
              run: mkdir -p backups

            - name: Generate Backup Name
              id: backup_name
              run: echo "FILE_NAME=db-backup-$(date +'%Y-%m-%d_%H-%M-%S').sql.gz" >> $GITHUB_ENV

            - name: Dump Database
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
              run: |
                  set -eo pipefail
                  if [ -z "$SUPABASE_DB_URL" ]; then
                    echo "::error::SUPABASE_DB_URL secret is missing in GitHub Repository Secrets!"
                    exit 1
                  fi
                  echo "Starting database dump..."
                  pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists | gzip > backups/${FILE_NAME}
                  echo "Database dump created: backups/${FILE_NAME}"

            - name: Upload Backup Artifact to GitHub Actions
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.FILE_NAME }}
                  path: backups/${{ env.FILE_NAME }}
                  retention-days: 14

            - name: Configure AWS Credentials
              if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

            - name: Upload Backup to AWS S3
              if: ${{ secrets.S3_BUCKET_NAME != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
              env:
                  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
              run: |
                  aws s3 cp backups/${FILE_NAME} s3://${S3_BUCKET_NAME}/backups/${FILE_NAME}
                  echo "Successfully uploaded backup to S3 bucket: ${S3_BUCKET_NAME}"


            # Optional: Prune old backups (keep last 30 days) if your S3 bucket doesn't have a lifecycle rule
            # Note: It's better to configure a lifecycle rule directly in the S3 bucket settings.
